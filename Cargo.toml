[package]
name = "letme"
version = "0.1.0"
edition = "2024"
description = "Auto-detecting dev command runner: letme test runs the right test command in any project"
repository = "https://github.com/rioderelfte/letme"
license = "MIT"
rust-version = "1.87"
authors = ["Florian Sowade"]
keywords = ["cli", "task-runner", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
owo-colors = "4"
supports-color = "3"
inquire = "0.9"
etcetera = "0.11"
unicode-width = "0.2"
which = "8"

[dev-dependencies]
tempfile = "3"
